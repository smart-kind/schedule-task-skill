<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="880" height="780" fill="#ffffff"/>

  <rect x="290" y="20" width="300" height="40" rx="20" fill="#ddf4ff" stroke="#0969da"/>
  <text x="440" y="45" font-size="14" fill="#0969da" text-anchor="middle" font-weight="bold">作者验收合并（merge-batch）</text>

  <line x1="440" y1="60" x2="440" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="90" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="113" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">读取批次清单</text>
  <text x="440" y="133" font-size="11.5" fill="#57606a" text-anchor="middle">这个批次有哪些任务、按什么顺序并入、并入哪个分支</text>

  <line x1="440" y1="146" x2="440" y2="171" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="176" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="199" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">拉取最新</text>
  <text x="440" y="219" font-size="11.5" fill="#57606a" text-anchor="middle">确保看到各执行机推回来的最新成果</text>

  <line x1="440" y1="232" x2="440" y2="257" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="262" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="285" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">逐个成员任务验收</text>
  <text x="440" y="305" font-size="11.5" fill="#57606a" text-anchor="middle">按清单顺序来，一次一个</text>

  <line x1="440" y1="318" x2="440" y2="343" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="348" width="200" height="44" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="440" y="375" font-size="13.5" font-weight="bold" fill="#9a6700" text-anchor="middle">任务分支上有「完成」报告？</text>

  <line x1="340" y1="370" x2="180" y2="370" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="362" font-size="11.5" fill="#57606a">否（还没完成）</text>
  <rect x="80" y="350" width="100" height="40" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="130" y="374" font-size="12" fill="#57606a" text-anchor="middle">跳过它</text>

  <line x1="440" y1="392" x2="440" y2="417" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="410" font-size="11.5" fill="#57606a">是</text>

  <rect x="290" y="422" width="300" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="440" y="445" font-size="13.5" font-weight="bold" fill="#1a7f37" text-anchor="middle">把它的分支并入目标分支</text>
  <text x="440" y="465" font-size="11.5" fill="#1a7f37" text-anchor="middle">按依赖顺序落地，前面的先合</text>

  <line x1="440" y1="478" x2="440" y2="503" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="508" width="200" height="44" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="440" y="535" font-size="13.5" font-weight="bold" fill="#9a6700" text-anchor="middle">合并有冲突？</text>

  <line x1="340" y1="530" x2="180" y2="530" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="522" font-size="11.5" fill="#57606a">是</text>
  <line x1="180" y1="530" x2="180" y2="566" stroke="#57606a" stroke-width="2"/>
  <line x1="180" y1="566" x2="285" y2="566" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="571" width="300" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="440" y="594" font-size="13.5" font-weight="bold" fill="#cf222e" text-anchor="middle">中止，交人工解决</text>
  <text x="440" y="614" font-size="11.5" fill="#cf222e" text-anchor="middle">绝不强行合并；解决后重新跑一遍即可</text>

  <line x1="440" y1="627" x2="440" y2="653" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="646" font-size="11.5" fill="#57606a">否（继续下一个）</text>

  <rect x="290" y="658" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="681" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">全部处理完 → 推送</text>
  <text x="440" y="701" font-size="11.5" fill="#57606a" text-anchor="middle">合并后的成果推回远程仓库</text>

  <line x1="440" y1="714" x2="440" y2="738" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="743" width="200" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="440" y="762" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="bold">验收完成</text>

  <text x="440" y="778" font-size="11" fill="#57606a" text-anchor="middle">只有作者能做这一步 —— 执行机永不合并</text>
</svg>
