<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="1030" fill="#ffffff"/>

  <rect x="350" y="20" width="200" height="40" rx="20" fill="#ddf4ff" stroke="#0969da"/>
  <text x="450" y="45" font-size="14" fill="#0969da" text-anchor="middle" font-weight="bold">执行一个任务（run）</text>

  <line x1="450" y1="60" x2="450" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="90" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="113" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">标记「运行中」</text>
  <text x="450" y="131" font-size="11" fill="#57606a" text-anchor="middle">通知钩子：任务开工了</text>

  <line x1="450" y1="140" x2="450" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="170" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="193" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">准备专属工作区</text>
  <text x="450" y="211" font-size="11" fill="#57606a" text-anchor="middle">每个任务一条分支，互不干扰；上次跑过就接着用</text>

  <line x1="450" y1="220" x2="450" y2="245" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="250" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="273" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">读取任务说明</text>
  <text x="450" y="291" font-size="11" fill="#57606a" text-anchor="middle">说明里写明了：做什么、验收标准、注意事项</text>

  <line x1="450" y1="300" x2="450" y2="325" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop box -->
  <rect x="270" y="330" width="360" height="370" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="6 4"/>
  <text x="450" y="354" font-size="13" font-weight="bold" fill="#9a6700" text-anchor="middle">执行循环（最多 60 轮，跨数天）</text>

  <rect x="300" y="368" width="300" height="46" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="389" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">有旧会话？</text>
  <text x="450" y="406" font-size="11" fill="#57606a" text-anchor="middle">有 → 接着上次继续干；没有 → 全新开始</text>

  <line x1="450" y1="414" x2="450" y2="437" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="442" width="300" height="46" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="463" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">发起编码助手（claude / kimi）</text>
  <text x="450" y="480" font-size="11" fill="#57606a" text-anchor="middle">它独立干活：写代码、跑测试、自查</text>

  <line x1="450" y1="488" x2="450" y2="511" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="516" width="300" height="46" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="450" y="537" font-size="13" font-weight="bold" fill="#9a6700" text-anchor="middle">出现「完成标记」？</text>
  <text x="450" y="554" font-size="11" fill="#9a6700" text-anchor="middle">是 → 认定完成，走出循环</text>

  <!-- done: exit right, then down to verification -->
  <line x1="600" y1="539" x2="700" y2="539" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="531" font-size="11.5" fill="#1a7f37" text-anchor="middle">是（完成）</text>
  <line x1="700" y1="539" x2="700" y2="765" stroke="#1a7f37" stroke-width="2"/>
  <line x1="700" y1="765" x2="605" y2="765" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- not done: down to the failure-handling box -->
  <line x1="450" y1="562" x2="450" y2="585" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="578" font-size="11.5" fill="#57606a">否</text>

  <rect x="300" y="590" width="300" height="62" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="613" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">没完成怎么办？</text>
  <text x="450" y="632" font-size="11" fill="#57606a" text-anchor="middle">撞上使用限额 → 停车等重置再回来</text>
  <text x="450" y="647" font-size="11" fill="#57606a" text-anchor="middle">其他失败 → 短暂等待后重试（都有限次）</text>

  <!-- loop back up the left channel -->
  <line x1="300" y1="621" x2="170" y2="621" stroke="#9a6700" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="170" y1="621" x2="170" y2="391" stroke="#9a6700" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="170" y1="391" x2="295" y2="391" stroke="#9a6700" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="176" y="515" font-size="11" fill="#9a6700" transform="rotate(-90 176 515)">回到循环开始（重试 / 等重置）</text>

  <!-- verification (below the loop, right corridor feeds in) -->
  <line x1="450" y1="700" x2="450" y2="735" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="723" font-size="11.5" fill="#57606a">带着「完成标记」走出循环</text>

  <rect x="300" y="740" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="763" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">双重验证</text>
  <text x="450" y="781" font-size="11" fill="#57606a" text-anchor="middle">出现完成标记 且 确实有新提交 —— 才算数</text>

  <line x1="450" y1="790" x2="450" y2="815" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="820" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="843" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">写执行报告</text>
  <text x="450" y="861" font-size="11" fill="#57606a" text-anchor="middle">结果摘要：完成/失败、重试次数、最后的话</text>

  <line x1="450" y1="870" x2="450" y2="895" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="900" width="300" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="450" y="923" font-size="13.5" font-weight="bold" fill="#1a7f37" text-anchor="middle">推送成果 + 记录最终状态</text>
  <text x="450" y="941" font-size="11" fill="#1a7f37" text-anchor="middle">作者那边一拉就能看到（绝不擅自合并）</text>

  <line x1="450" y1="950" x2="450" y2="978" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="983" width="200" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="450" y="1002" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="bold">任务收尾</text>
</svg>
