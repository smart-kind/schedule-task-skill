<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="820" height="700" fill="#ffffff"/>

  <rect x="310" y="20" width="200" height="40" rx="20" fill="#ddf4ff" stroke="#0969da"/>
  <text x="410" y="45" font-size="14" fill="#0969da" text-anchor="middle" font-weight="bold">取消任务（cancel）</text>

  <line x1="410" y1="60" x2="410" y2="85" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="90" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="410" y="113" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">选择目标</text>
  <text x="410" y="133" font-size="11.5" fill="#57606a" text-anchor="middle">单个任务，或「全部在排队/运行中的任务」</text>

  <line x1="410" y1="146" x2="410" y2="171" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="176" width="200" height="44" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="410" y="203" font-size="13.5" font-weight="bold" fill="#9a6700" text-anchor="middle">任务已经收尾了？</text>

  <line x1="310" y1="198" x2="150" y2="198" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="190" font-size="11.5" fill="#57606a">是（完成/失败/已取消）</text>
  <rect x="50" y="178" width="100" height="40" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="100" y="202" font-size="12" fill="#57606a" text-anchor="middle">拒绝，不动它</text>

  <line x1="410" y1="220" x2="410" y2="245" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="238" font-size="11.5" fill="#57606a">否</text>

  <rect x="260" y="250" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="410" y="273" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">停掉运行中的任务</text>
  <text x="410" y="293" font-size="11.5" fill="#57606a" text-anchor="middle">连同编码助手一起停（等限额时也能停）</text>

  <line x1="410" y1="306" x2="410" y2="331" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="336" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="410" y="359" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">标记「已取消」+ 记录原因</text>
  <text x="410" y="379" font-size="11.5" fill="#57606a" text-anchor="middle">看门狗从此跳过它；通知钩子收到取消消息</text>

  <line x1="410" y1="392" x2="410" y2="417" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="422" width="200" height="44" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="410" y="449" font-size="13.5" font-weight="bold" fill="#9a6700" text-anchor="middle">有任务依赖它吗？</text>

  <line x1="310" y1="444" x2="150" y2="444" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="436" font-size="11.5" fill="#57606a">是</text>
  <line x1="150" y1="444" x2="150" y2="480" stroke="#57606a" stroke-width="2"/>
  <line x1="150" y1="480" x2="255" y2="480" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="485" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="410" y="508" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">级联取消依赖者</text>
  <text x="410" y="528" font-size="11.5" fill="#57606a" text-anchor="middle">依赖已取消的任务干不了活，一并取消并记录根因</text>

  <line x1="410" y1="541" x2="410" y2="577" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="564" font-size="11.5" fill="#57606a">否（没有依赖者）</text>

  <rect x="260" y="582" width="300" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="410" y="605" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle">收尾：代码现场保留</text>
  <text x="410" y="625" font-size="11.5" fill="#57606a" text-anchor="middle">任务分支和工作现场不动，方便事后检查</text>

  <line x1="410" y1="638" x2="410" y2="662" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="666" width="200" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="410" y="685" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="bold">完成</text>

  <text x="410" y="698" font-size="11" fill="#57606a" text-anchor="middle">取消只在执行机上生效（需要现场状态与进程）</text>
</svg>
